<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 하기</title>
    <link rel="stylesheet" href="CSS/login.css" />
  </head>
  <body>
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <button class="close-btn" id="closeBtn" title="이전 페이지로">×</button>

        <!-- 로고 섹션 -->
        <div class="logo-section">
          <a href="/home.html">
           <a href="home.html"
        ><img src="./img/edit_logo.png" alt="서비스 로고"
      /></a>
        </div>

        <div class="modal-content">
          <h2>로그인 하기</h2>

          <form id="loginForm">
            <div class="input-group">
              <label>아이디</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  id="username"
                  placeholder="아이디 입력"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label>비밀번호</label>
              <div class="input-wrapper">
                <input
                  type="password"
                  id="password"
                  placeholder="비밀번호 입력"
                  required
                />
              </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="checkbox-group">
              <input type="checkbox" id="autoLogin" />
              <label for="autoLogin">자동 로그인하기</label>
            </div>

            <!-- 로그인 버튼 추가 -->
            <button type="submit" class="login-btn" id="loginBtn">
              로그인
            </button>
          </form>

          <div class="divider">
            <span>간편 로그인</span>
          </div>

          <div class="social-login">
            <button class="social-btn naver-btn" id="naverBtn" type="button">
              <span style="font-family: 'Arial Black', sans-serif">N</span>
            </button>
            <button
              class="social-btn kakao-btn"
              id="kakaoBtn"
              type="button"
            ></button>
          </div>
        </div>
      </div>
    </div>

    <script src="JS/login.js"></script>
  </body>
</html>
